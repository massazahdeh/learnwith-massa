<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clinic Day · Lecture 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: clinic waiting room (3 patient files) → per-patient case: dental chart / illustration on the left, question + patient file on the right */
:root {
  --bg: #EEF3F2; --paper: #FBFDFC; --ink: #15302E; --muted: #5B706D; --line: #CBD8D5;
  --accent: #0B6B66; --accent-ink: #FFFFFF; --accent-soft: #D5EBE8;
  --mark: #C97F00; --mark-soft: #FCE7B8;
  --ok: #2E8B57; --ok-soft: #D7F0E0; --bad: #C2453D; --bad-soft: #F7DCD9;
  --enamel: #FFFFFF; --enamel-line: #7F9894; --primary-tooth: #DDEBF5;
  --gum: #F3CFCB; --root: #EFE3C8; --bone: #E8E3D6; --pulp: #F0A9A3;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1A19; --paper: #162423; --ink: #E4EFED; --muted: #93A8A4; --line: #2A3D3B;
  --accent: #4FC1B8; --accent-ink: #062321; --accent-soft: #1D3B39;
  --mark: #F2B33D; --mark-soft: #4A3810;
  --ok: #5BC88A; --ok-soft: #173A27; --bad: #EE7B72; --bad-soft: #43201D;
  --enamel: #EEF3F2; --enamel-line: #6E8784; --primary-tooth: #C3D7E6;
  --gum: #7A4545; --root: #9C8A62; --bone: #2C2B23; --pulp: #B4605A;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1A19; --paper: #162423; --ink: #E4EFED; --muted: #93A8A4; --line: #2A3D3B;
  --accent: #4FC1B8; --accent-ink: #062321; --accent-soft: #1D3B39;
  --mark: #F2B33D; --mark-soft: #4A3810;
  --ok: #5BC88A; --ok-soft: #173A27; --bad: #EE7B72; --bad-soft: #43201D;
  --enamel: #EEF3F2; --enamel-line: #6E8784; --primary-tooth: #C3D7E6;
  --gum: #7A4545; --root: #9C8A62; --bone: #2C2B23; --pulp: #B4605A;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -0.01em; margin: 0; }
.brand .sub { color: var(--muted); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
.score { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip strong { color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* waiting room */
.intro { display: grid; gap: 6px; max-width: 70ch; }
.intro h2 { font-family: var(--f-display); font-size: 34px; line-height: 1.1; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); }
.intro .ar { font-size: 17px; color: var(--ink); }
.patients { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.pcard { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: start; cursor: pointer; position: relative; overflow: hidden; }
.pcard:hover { border-color: var(--accent); }
.pcard .tab { position: absolute; inset-block-start: 0; inset-inline-end: 18px; background: var(--accent-soft); color: var(--accent); font-family: var(--f-mono); font-size: 12px; padding: 4px 10px; border-radius: 0 0 8px 8px; }
.pcard h3 { font-family: var(--f-display); font-size: 24px; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.pcard h3 .ar { font-size: 20px; font-weight: 600; }
.pcard .age { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.pcard p { margin: 0; }
.pcard .complaint { font-size: 14px; }
.pcard .complaint.ar { font-size: 15px; color: var(--muted); }
.pcard .status { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; gap: 8px; flex-wrap: wrap; }
.pcard .status b { color: var(--ink); font-family: var(--f-mono); }
.pcard.done .status b { color: var(--ok); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: 1 1 80px; }
.meter i { display: block; height: 100%; background: var(--accent); }

/* case view */
.case { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .case { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.casehead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.casehead h2 { font-family: var(--f-display); font-size: 26px; margin: 0; }
.casehead .ar { font-size: 20px; }
.casenote { margin: 0; font-size: 14px; }
.casenote.ar { font-size: 15px; color: var(--muted); }
.vis { background: var(--bg); border-radius: 10px; padding: 8px; overflow-x: auto; }
.vis svg { display: block; width: 100%; height: auto; min-width: 300px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend svg { width: 18px; height: 18px; }
.toolrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--mark); }
.dots i.ok { background: var(--ok); }
.dots i.bad { background: var(--bad); }

/* question */
.kicker { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); font-weight: 600; flex-wrap: wrap; }
.kicker .ar { text-transform: none; letter-spacing: 0; font-size: 13px; }
.qtext { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.25; margin: 0; text-wrap: balance; }
.qtext-ar { font-size: 17px; margin: 0; }
.hint { font-size: 13px; background: var(--mark-soft); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.opts { display: grid; gap: 8px; }
.opt { text-align: start; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .ar { color: var(--muted); font-size: 14px; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.opt.mono { font-family: var(--f-mono); font-size: 17px; justify-content: center; }
.opts.grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tap { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tap::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--mark); animation: pulse 1.4s infinite; flex: none; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .tap::before { animation: none; } }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 480px) { .slots { grid-template-columns: minmax(0, 1fr); } }
.slot { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.slot select { font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; }
.slot select.ok { border-color: var(--ok); background: var(--ok-soft); }
.slot select.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback { border-radius: 10px; padding: 12px; display: grid; gap: 4px; font-size: 14px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { font-family: var(--f-display); font-size: 16px; }
.feedback .ar { font-size: 15px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* patient file */
.file h3 { font-family: var(--f-display); font-size: 17px; margin: 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.file h3 .ar { font-size: 15px; font-weight: 500; color: var(--muted); }
.file dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0; font-size: 14px; }
.file dt, .file dd { padding: 7px 0; border-bottom: 1px dashed var(--line); margin: 0; }
.file dt { color: var(--muted); padding-inline-end: 14px; font-size: 13px; }
.file dd { font-weight: 500; }
.file dd .ar { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.file dd.empty { color: var(--line); }
.file dd.new { animation: flash 1.2s; }
@keyframes flash { from { background: var(--mark-soft); } }
@media (prefers-reduced-motion: reduce) { .file dd.new { animation: none; } }

/* summary */
.summary { display: grid; gap: 14px; justify-items: start; }
.summary h2 { font-family: var(--f-display); font-size: 30px; margin: 0; }
.bigscore { font-family: var(--f-mono); font-size: 44px; font-weight: 600; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.bysec { display: flex; flex-wrap: wrap; gap: 6px; }
.bysec span { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.bysec span.ok { border-color: var(--ok); color: var(--ok); }
.bysec span.bad { border-color: var(--bad); color: var(--bad); }

/* svg parts */
.gum { fill: var(--gum); opacity: .55; }
.rootp { fill: var(--root); stroke: var(--enamel-line); stroke-width: 1; }
.crown { fill: var(--enamel); stroke: var(--enamel-line); stroke-width: 1.3; }
.tooth.prim .crown { fill: var(--primary-tooth); }
.tooth.unerupted .crown, .tooth.unerupted .rootp { stroke-dasharray: 3 2; opacity: .7; }
.tooth.missing .crown { fill: none; stroke-dasharray: 3 3; opacity: .55; }
.tooth.missing .rootp { display: none; }
.tooth.hl .crown { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 2.6; }
.tooth.ok .crown { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2.6; }
.tooth.bad .crown { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2.6; }
.chart.clickable .tooth:not(.missing) { cursor: pointer; }
.chart.clickable .tooth:not(.missing):hover .crown, .chart.clickable .tooth:focus-visible .crown { stroke: var(--accent); stroke-width: 2.6; }
.tooth:focus { outline: none; }
.num { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.num.show-ok { fill: var(--ok); font-weight: 600; }
.axis { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; opacity: .6; }
.side { font-family: var(--f-body); font-size: 11px; fill: var(--muted); font-weight: 600; letter-spacing: .06em; }
.plabel { font-family: var(--f-body); font-size: 12px; fill: var(--ink); font-weight: 600; }
.plabel.ok { fill: var(--ok); }
.part { cursor: default; }
.ill.clickable .part { cursor: pointer; }
.ill.clickable .part:hover, .ill.clickable .part:focus-visible { stroke: var(--accent); stroke-width: 3; }
.part.hl { stroke: var(--mark); stroke-width: 3; }
.part.ok { stroke: var(--ok); stroke-width: 3.5; }
.part.bad { stroke: var(--bad); stroke-width: 3.5; }
.p-enamel { fill: var(--enamel); stroke: var(--enamel-line); stroke-width: 1.5; }
.p-root { fill: var(--root); stroke: var(--enamel-line); stroke-width: 1.5; }
.p-bone { fill: var(--bone); }
.p-gum { fill: var(--gum); }
.p-pulp { fill: var(--pulp); opacity: .7; }
.p-furc { fill: var(--accent-soft); stroke: var(--enamel-line); stroke-width: 1; stroke-dasharray: 3 2; }
.p-edge { fill: var(--primary-tooth); stroke: var(--enamel-line); stroke-width: 1.5; }
.p-cusp { fill: var(--enamel); stroke: var(--enamel-line); stroke-width: 1.5; }
.p-ridge { fill: var(--primary-tooth); stroke: var(--enamel-line); stroke-width: 1.2; }
.p-occl { fill: var(--root); stroke: var(--enamel-line); stroke-width: 1.5; }
.p-groove { stroke: var(--enamel-line); stroke-width: 1.2; fill: none; }
.p-epi { fill: var(--gum); stroke: var(--enamel-line); stroke-width: 1; }
.p-papilla { fill: var(--primary-tooth); stroke: var(--enamel-line); stroke-width: 1; }
.p-organ { fill: var(--mark-soft); stroke: var(--enamel-line); stroke-width: 1.5; }
.ill text { font-family: var(--f-body); }
.lbl { font-size: 13px; fill: var(--muted); font-weight: 600; text-anchor: middle; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Clinic Day</h1>
      <span class="sub">Lecture 6 · Dental terminology</span>
      <span class="ar" style="color:var(--muted)">يوم في العيادة</span>
    </div>
    <div class="score" id="score"></div>
  </header>
  <main id="app"></main>
</div>

<script>
// ───────── terminology (same wording as the Lecture 6 lab) ─────────
const SECTIONS = {
  1: { en: 'Identify the Tooth', ar: 'تعرّف على السن' }, 2: { en: 'Build the Tooth Name', ar: 'ركّب اسم السن' },
  3: { en: 'Jaw & Quadrant', ar: 'الفك وربع الأسنان' }, 4: { en: 'FDI Numbering', ar: 'ترقيم FDI' },
  5: { en: 'Crown & Root', ar: 'التاج والجذر' }, 6: { en: 'Root Morphology', ar: 'شكل الجذور' },
  7: { en: 'Basic Tooth Morphology', ar: 'شكل السن الأساسي' }, 8: { en: 'Tooth Development', ar: 'تطور الأسنان' },
  9: { en: 'Eruption', ar: 'بزوغ الأسنان' }, 10: { en: 'Developmental Terminology', ar: 'مصطلحات اضطرابات النمو' },
  11: { en: 'Dentition', ar: 'مجموعة الأسنان' },
};
const TT = { incisor: { en: 'Incisor', ar: 'القاطع' }, canine: { en: 'Canine', ar: 'الناب' }, premolar: { en: 'Premolar', ar: 'الضاحك' }, molar: { en: 'Molar', ar: 'الطاحن' } };
const POS = { central: { en: 'central', ar: 'المركزي' }, lateral: { en: 'lateral', ar: 'الجانبي' }, first: { en: 'first', ar: 'الأول' }, second: { en: 'second', ar: 'الثاني' }, third: { en: 'third', ar: 'الثالث' } };
const QUAD = { 1: { en: 'Upper right', ar: 'العلوي الأيمن' }, 2: { en: 'Upper left', ar: 'العلوي الأيسر' }, 3: { en: 'Lower left', ar: 'السفلي الأيسر' }, 4: { en: 'Lower right', ar: 'السفلي الأيمن' } };
const SPEC = { 1: ['incisor', 'central'], 2: ['incisor', 'lateral'], 3: ['canine', null], 4: ['premolar', 'first'], 5: ['premolar', 'second'], 6: ['molar', 'first'], 7: ['molar', 'second'], 8: ['molar', 'third'] };
const info = f => { const q = Math.floor(f / 10), n = f % 10; return { q, n, up: q <= 2, type: SPEC[n][0], pos: SPEC[n][1] }; };
const nameOf = f => { const i = info(f); return {
  en: (i.up ? 'Maxillary ' : 'Mandibular ') + (i.pos ? i.pos + ' ' : '') + i.type + (i.pos === 'third' ? ' (wisdom tooth)' : ''),
  ar: TT[i.type].ar + (i.pos ? ' ' + POS[i.pos].ar : '') + (i.up ? ' العلوي' : ' السفلي') + (i.pos === 'third' ? ' (ضرس العقل)' : '') }; };
const fdiExplain = f => { const q = Math.floor(f / 10), d = f % 10, n = nameOf(f); return {
  en: `${q} = ${QUAD[q].en.toLowerCase()} quadrant · ${d} = tooth ${d} from the midline → ${n.en}.`,
  ar: `${q} = الربع ${QUAD[q].ar} · ${d} = السن رقم ${d} من خط المنتصف ← ${n.ar}` }; };
const TYPE_EXPL = {
  incisor: { en: 'Incisor = a front tooth.', ar: 'القاطع = سن أمامي.' },
  canine: { en: 'Canine = the pointed tooth located between the incisors and premolars.', ar: 'الناب = السن المدبب الذي يقع بين القواطع والضواحك.' },
  premolar: { en: 'Premolar = the tooth between the canine and the molars.', ar: 'الضاحك = السن الذي يقع بين الناب والطواحن.' },
  molar: { en: 'Molar = a back, chewing tooth.', ar: 'الطاحن = سن خلفي للمضغ.' },
};
const FDI_HINT = { en: 'FDI: first digit = quadrant (1 upper right · 2 upper left · 3 lower left · 4 lower right). Second digit = tooth position from the midline (1–8).', ar: 'الرقم الأول = الربع · الرقم الثاني = موضع السن من خط المنتصف (١–٨)' };
const PREFIX_HINT = { en: 'hypo- = deficient · oligo- = few · an- = absent · hyper- = excessive · odont = tooth', ar: 'hypo- ناقص · oligo- قليل · an- غياب · hyper- زائد · odont سن' };
const QUAD_EXPL = { en: 'A quadrant is one quarter of the dentition. Right and left always mean the patient’s right and left. The patient faces you, so the patient’s right side is on your left.', ar: 'الربع هو ربع مجموعة الأسنان. اليمين واليسار دائماً حسب المريض. المريض يواجهك، لذلك يمين المريض على يسارك.' };

const o = (en, ar, ok = false) => ({ en, ar, ok });
const L = (en, ar) => ({ en, ar });
const typeOpts = t => ['incisor', 'canine', 'premolar', 'molar'].map(k => o(TT[k].en, TT[k].ar, k === t));
const quadOpts = q => [1, 2, 3, 4].map(k => o(QUAD[k].en, QUAD[k].ar, k === q));
const DENT = ok => [o('Primary dentition', 'الأسنان اللبنية', ok === 0), o('Mixed dentition', 'مرحلة الأسنان المختلطة', ok === 1), o('Permanent dentition', 'الأسنان الدائمة', ok === 2)];
const DENT_EXPL = [
  L('Primary dentition = the first set of teeth (baby teeth).', 'الأسنان اللبنية = المجموعة الأولى من الأسنان.'),
  L('Mixed dentition = a stage when both primary and permanent teeth are present.', 'مرحلة الأسنان المختلطة = مرحلة توجد فيها الأسنان اللبنية والدائمة معاً.'),
  L('Permanent dentition = only permanent (adult) teeth are present.', 'الأسنان الدائمة = توجد الأسنان الدائمة فقط.'),
];

}
function bindCase(p, q) {
  const h = document.getElementById('hintBtn'); if (h) h.onclick = () => { cur.hint = true; caseView(); };
  const nb = document.getElementById('nums'); if (nb) nb.onclick = () => { S.showNums = !S.showNums; caseView(); };
  const nx = document.getElementById('next'); if (nx) { nx.onclick = next; nx.focus({ preventScroll: true }); }
  if (cur.answered) return;
  if (q.kind === 'mc') app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(p, q, +b.dataset.k));
  if (q.kind === 'build') {
    const sels = q.slots.map((_, k) => document.getElementById('slot' + k));
    document.getElementById('check').onclick = () => {
      const vals = sels.map(s => s.value);
      if (vals.some(v => !v)) { sels.forEach(s => { if (!s.value) s.classList.add('bad'); }); return; }
      answer(p, q, vals);
    };
  }
  if (q.kind === 'tooth') app.querySelectorAll('.chart .tooth:not(.missing)').forEach(g => {
    g.setAttribute('tabindex', '0');
    const go = () => { const id = g.dataset.id === 'SN' ? 'SN' : +g.dataset.id; answer(p, q, id); };
    g.addEventListener('click', go); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  if (q.kind === 'part') app.querySelectorAll('.ill [data-part]').forEach(g => {
    g.setAttribute('tabindex', '0');
    const go = () => answer(p, q, g.dataset.part);
    g.addEventListener('click', go); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}
function answer(p, q, val) {
  const pr = S.prog[p.id]; let ok = false; const res = { okIds: [], badIds: [] };
  if (q.kind === 'mc') { ok = pr.order[pr.i][val].ok; cur.picked = val; }
  if (q.kind === 'build') { ok = q.slots.every((sl, k) => val[k] === sl.ans); cur.picked = val; }
  if (q.kind === 'tooth') {
    ok = q.acceptQ ? (val !== 'SN' && Math.floor(val / 10) === q.acceptQ) : q.accept.includes(val);
    res.okIds = ok && q.acceptQ ? [...new Set([val, ...q.reveal])] : q.reveal.slice();
    if (!ok) res.badIds = [val];
  }
  if (q.kind === 'part') {
    ok = q.accept.includes(val);
    res.okIds = q.reveal === 'clicked' ? (ok ? [val] : q.accept.slice()) : q.reveal.slice();
    if (!ok) res.badIds = [val];
  }
  if (q.kind === 'mc' || q.kind === 'build') res.okIds = (q.hl || []).filter(x => q.vis === 'chart' && ok);
  pr.results.push(ok); cur.answered = true; cur.res = res; renderScore(); caseView();
}
function next() {
  const p = P(S.pid), pr = S.prog[p.id];
  Object.assign(cur, { answered: false, picked: null, hint: false, res: null });
  if (pr.i + 1 < p.qs.length) { pr.i++; render(); }
  else { pr.done = true; S.view = 'summary'; render(); }
}
function summary() {
  const p = P(S.pid), pr = S.prog[p.id], n = p.qs.length, sc = scoreOf(p.id);
  const secs = [...new Set(p.qs.map(q => q.sec))];
  const chips = secs.map(s => { const idx = p.qs.map((q, k) => q.sec === s ? k : -1).filter(k => k >= 0); const all = idx.every(k => pr.results[k]);
    return `<span class="${all ? 'ok' : 'bad'}">${SECTIONS[s].en}</span>`; }).join('');
  const left = PATIENTS.filter(x => !S.prog[x.id].done);
  Object.assign(cur, { answered: true, res: null });
  app.innerHTML = `<div class="case">
    <section class="panel summary">
      <div class="kicker"><span>File closed</span><span class="ar">تم إغلاق الملف</span></div>
      <h2>${p.name.en} <span class="ar">${p.name.ar}</span></h2>
      <span class="bigscore">${sc} / ${n}</span>
      <p style="margin:0">${sc === n ? 'Every answer right on the first try.' : sc >= n * 0.7 ? 'Good work. Review the red sections below.' : 'Review the red sections, then try this patient again.'}</p>
      <div class="bysec">${chips}</div>
      <div class="actions" style="justify-content:flex-start">
        ${left.length ? `<button class="btn btn-primary" data-p="${left[0].id}">Next patient: ${left[0].name.en} · ${left[0].name.ar} →</button>` : `<button class="btn btn-primary" id="room">Back to the waiting room · غرفة الانتظار</button>`}
        <button class="btn" id="retry">Retry ${p.name.en} · أعد المحاولة</button>
      </div>
    </section>
    <section class="panel file"><h3>Patient file <span class="ar">ملف المريض</span></h3><dl>${recordRows(p)}</dl></section></div>`;
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => openPatient(b.dataset.p));
  const r = document.getElementById('room'); if (r) r.onclick = () => { S.view = 'room'; render(); };
  document.getElementById('retry').onclick = () => {
    S.prog[p.id] = { i: 0, results: [], order: p.qs.map(q => q.options ? (q.mono ? q.options : shuffle(q.options)) : null), done: false };
    openPatient(p.id);
  };
}
render();
</script>
