<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a bright cartoon clinic. Map of 5 rooms → per challenge: big illustration left, task + teacher controls right. Single light look for classroom projection. */
:root {
  color-scheme: light;
  --bg: #EEF6FB; --paper: #FFFFFF; --ink: #1E2A3A; --muted: #586379; --line: #D3DFEA;
  --turq: #14A99D; --turq-soft: #D3F2EE; --blue: #3B7DDD; --blue-soft: #DDE9FC;
  --coral: #FF6F61; --coral-soft: #FFE3DF; --lav: #8A78E3; --lav-soft: #ECE8FC;
  --yellow: #FFC23D; --yellow-soft: #FFF1C9;
  --ok: #1E9A68; --ok-soft: #DCF4E8; --bad: #DD4A4A; --bad-soft: #FCE2E2;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-ar: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; text-align: right; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 18px; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; margin: 0; letter-spacing: .01em; }
.brand h1 span { color: var(--turq); }
.brand small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.keys { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 8px; }
.keys .lab { font-size: 13px; font-weight: 700; color: var(--muted); margin-inline-start: 4px; }
.key { width: 30px; height: 30px; }
.key path, .key circle { fill: #D7DEE7; }
.key.on path, .key.on circle { fill: var(--yellow); stroke: #C48A00; stroke-width: 1.5; }
.key.pop { animation: pop .8s ease; }
@keyframes pop { 0% { transform: scale(.4) rotate(-30deg); } 60% { transform: scale(1.4) rotate(10deg); } 100% { transform: scale(1); } }
.teams { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.team { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 5px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 700; }
.team .pts { font-family: var(--f-display); font-size: 20px; color: var(--tc); min-width: 2.5ch; text-align: end; font-variant-numeric: tabular-nums; }
.team .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); }
.team.active { border-color: var(--tc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 25%, transparent); }
.team.solo { cursor: default; }
.teams .hint { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.btn { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 8px 14px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not([disabled]) { border-color: var(--blue); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-go { background: var(--turq); border-color: var(--turq); color: #fff; }
.btn-go:hover:not([disabled]) { border-color: #0E8A80; background: #0E978C; }
.btn-coral { background: var(--coral); border-color: var(--coral); color: #fff; }
.btn-yellow { background: var(--yellow); border-color: var(--yellow); }
.btn-ar { font-family: var(--f-ar); }
.btn-ar.on { background: var(--lav-soft); border-color: var(--lav); }
.btn-sm { padding: 5px 10px; font-size: 14px; }

/* panels */
.panel { background: var(--paper); border: 2px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.roomtag { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.roomtag .pill { font-family: var(--f-display); font-weight: 600; font-size: 15px; padding: 4px 12px; border-radius: 999px; background: var(--rc-soft); color: var(--rc-ink); }
.roomtag .count { font-size: 14px; font-weight: 700; color: var(--muted); }
.progress { display: flex; gap: 6px; }
.progress i { width: 26px; height: 8px; border-radius: 4px; background: var(--line); display: block; }
.progress i.cur { background: var(--rc); }
.progress i.ok { background: var(--ok); }
.progress i.miss { background: var(--bad); }
.instr { font-family: var(--f-display); font-weight: 600; font-size: 25px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 15px; }
.badge2 { align-self: flex-start; background: var(--yellow-soft); border: 2px solid var(--yellow); color: #7A5600; font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 10px; }
.notecard { background: var(--blue-soft); border-radius: 14px; padding: 10px 14px; font-size: 15px; border-inline-start: 6px solid var(--blue); }
.vis { background: #F7FBFF; border-radius: 16px; border: 2px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.vis > svg { width: 100%; height: auto; max-height: 64vh; display: block; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.duo svg { width: 100%; height: auto; display: block; max-height: 58vh; }
.inset-cap { font-size: 13px; color: var(--muted); font-weight: 700; text-align: center; }

/* cards (picture targets) */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--paper); border: 3px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: center; position: relative; }
.card:hover { border-color: var(--blue); }
.card svg { width: 100%; height: auto; max-height: 36vh; display: block; }
.card .letter { position: absolute; top: 8px; inset-inline-start: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font-family: var(--f-display); font-weight: 600; display: grid; place-items: center; }
.card .ctext { font-size: 15px; font-weight: 700; }
.card .ctext.big { font-size: 18px; min-height: 120px; display: grid; place-items: center; padding: 34px 8px 8px; line-height: 1.3; }
.card .cname { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 6px; font-size: 15px; font-weight: 700; color: var(--muted); min-height: 40px; display: grid; place-items: center; }
.drop.filled { border-style: solid; border-color: var(--blue); background: var(--blue-soft); color: var(--ink); }
.drop.ok, .slot.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
.drop.bad, .slot.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.card.armed { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-soft); }

/* chips + slots */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 16px; }
.chip:hover:not([disabled]) { border-color: var(--blue); }
.chip.sel { background: var(--blue); color: #fff; border-color: var(--blue); }
.chip.used { opacity: .45; }
.chip[disabled] { cursor: default; }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); }
.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; border: 2px dashed var(--line); border-radius: 12px; padding: 6px 10px; cursor: pointer; min-height: 48px; background: var(--paper); text-align: start; }
.slot .l { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; font-family: var(--f-display); font-weight: 600; display: grid; place-items: center; }
.slot.filled { border-style: solid; border-color: var(--blue); background: var(--blue-soft); }
.slot .ph { color: var(--muted); font-size: 14px; }
.howto { font-size: 13px; color: var(--muted); font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { text-align: start; border: 2.5px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-weight: 700; font-size: 18px; display: flex; gap: 12px; align-items: center; }
.opt:hover:not([disabled]) { border-color: var(--blue); }
.opt .box { width: 22px; height: 22px; border-radius: 6px; border: 2.5px solid var(--muted); flex: none; display: grid; place-items: center; }
.opt.radio .box { border-radius: 50%; }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.sel .box { background: var(--blue); border-color: var(--blue); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.seq { display: grid; gap: 6px; counter-reset: s; }
.seq .step { display: flex; gap: 10px; align-items: center; border: 2px dashed var(--line); border-radius: 12px; padding: 8px 12px; min-height: 46px; font-weight: 700; cursor: pointer; background: var(--paper); text-align: start; }
.seq .step::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--lav); color: #fff; display: grid; place-items: center; font-family: var(--f-display); flex: none; }
.seq .step.filled { border-style: solid; border-color: var(--lav); background: var(--lav-soft); }
.seq .step.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.seq .step.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }

/* feedback + controls */
.fb { border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; font-size: 16px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.rev { background: var(--yellow-soft); }
.fb b.v { font-family: var(--f-display); font-weight: 600; font-size: 21px; }
.fb .ans { font-weight: 700; }
.fb .arx { background: var(--paper); border-radius: 10px; padding: 8px 10px; font-size: 17px; line-height: 1.6; }
.fb .warn { background: var(--paper); border-inline-start: 5px solid var(--yellow); border-radius: 8px; padding: 6px 10px; font-size: 15px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 2px dashed var(--line); padding-top: 12px; }
.controls .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.timer { font-family: var(--f-display); font-weight: 600; font-size: 20px; padding: 4px 12px; border-radius: 10px; background: var(--yellow-soft); min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }
.timer.low { background: var(--coral-soft); color: var(--bad); }
.plus { position: fixed; z-index: 50; font-family: var(--f-display); font-weight: 700; font-size: 40px; color: var(--ok); pointer-events: none; animation: rise 1.2s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translateY(0) scale(.8); } to { opacity: 0; transform: translateY(-80px) scale(1.2); } }

/* map */
.mapwrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .mapwrap { grid-template-columns: minmax(0, 1fr); } }
.guide { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.bubble { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; font-size: 16px; position: relative; }
.bubble::after { content: ""; position: absolute; bottom: -12px; left: 50%; border: 10px solid transparent; border-top-color: var(--paper); transform: translateX(-50%); }
.mascot { width: 150px; height: auto; animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.map > svg { width: 100%; height: auto; display: block; }
.room-g { cursor: pointer; }
.room-g.locked { cursor: not-allowed; }
.room-g:hover:not(.locked) .room-box { stroke-width: 6; }
.room-g:focus-visible { outline: none; }
.room-g:focus-visible .room-box { stroke: var(--ink); stroke-width: 6; }
.lockg.unlocking { animation: unlock 1.4s ease forwards; transform-box: fill-box; transform-origin: center; }
@keyframes unlock { 0% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-6deg) scale(1.1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

/* setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .setup { grid-template-columns: minmax(0, 1fr); } }
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero h2 { font-family: var(--f-display); font-size: 40px; margin: 0; line-height: 1.05; }
.hero p { margin: 6px 0 0; max-width: 52ch; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 2px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; }
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tname { display: flex; gap: 8px; align-items: center; }
.tname input { flex: 1; min-width: 0; font: inherit; font-weight: 700; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--paper); color: var(--ink); }
.tname i { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; }
.check input { width: 20px; height: 20px; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(30, 42, 58, .55); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--paper); border-radius: 22px; padding: 26px; max-width: 560px; width: 100%; display: grid; gap: 14px; text-align: center; justify-items: center; }
.modal h2 { font-family: var(--f-display); font-size: 32px; margin: 0; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.done-key { width: 120px; animation: pop 1s ease; }
.review { display: grid; gap: 10px; }
.review .item { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; }
.review .item b { font-family: var(--f-display); font-weight: 600; }
.review .item .room { font-size: 13px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.rank { display: grid; gap: 8px; }
.rank div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--bg); font-weight: 800; font-size: 20px; }
.rank div:first-child { background: var(--yellow-soft); border: 2px solid var(--yellow); }

/* cloze */
.note-sheet { background: #FFFDF5; border: 2px solid #EADFB8; border-radius: 16px; padding: 20px 22px; font-size: 21px; line-height: 2.1; box-shadow: inset 0 -40px 0 -38px #EADFB8; }
.note-sheet .head { font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; line-height: 1.4; display: block; margin-bottom: 6px; }
.blank { border: none; border-bottom: 3px solid var(--blue); background: var(--blue-soft); border-radius: 8px 8px 0 0; padding: 0 10px; min-width: 7ch; font-weight: 800; cursor: pointer; font-size: 19px; line-height: 1.5; }
.blank.sel { background: var(--yellow-soft); border-bottom-color: var(--yellow); }
.blank.ok { background: var(--ok-soft); border-bottom-color: var(--ok); }
.blank.bad { background: var(--bad-soft); border-bottom-color: var(--bad); }
.blank .n { font-size: 12px; color: var(--muted); margin-inline-end: 4px; }

/* svg anatomy */
.hot { cursor: pointer; fill: transparent; stroke: transparent; }
.hot:hover { stroke: var(--blue); stroke-width: 3; stroke-dasharray: 5 3; }
.hot.sel { stroke: var(--blue); stroke-width: 4; fill: rgba(59, 125, 221, .18); }
.hot.ok { stroke: var(--ok); stroke-width: 5; fill: rgba(30, 154, 104, .2); }
.hot.bad { stroke: var(--bad); stroke-width: 5; fill: rgba(221, 74, 74, .18); }
.hot.line.sel, .hot.line.ok, .hot.line.bad { fill: none; stroke-opacity: .45; stroke-width: 18; stroke-dasharray: none; }
.mk { cursor: pointer; }
.mk circle.c { fill: #fff; stroke: var(--ink); stroke-width: 3; }
.mk text { font-family: var(--f-display); font-weight: 600; font-size: 20px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.filled circle.c { fill: var(--blue); stroke: var(--blue); }
.mk.filled text { fill: #fff; }
.mk.ok circle.c { fill: var(--ok); stroke: var(--ok); }
.mk.bad circle.c { fill: var(--bad); stroke: var(--bad); }
.mk.ok text, .mk.bad text { fill: #fff; }
.mk.armed circle.c { stroke: var(--blue); stroke-width: 5; }
.mk:hover circle.c { stroke: var(--blue); }
.mk-line { stroke: var(--ink); stroke-width: 2.5; }
.mk-dot { fill: var(--ink); }
.mk-tag { font-family: var(--f-body); font-weight: 800; font-size: 15px; paint-order: stroke; stroke: #fff; stroke-width: 5px; fill: var(--ink); }
.anim-tap { animation: tap 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 0; }
@keyframes tap { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-7deg); } 55% { transform: rotate(2deg); } }
.anim-press { animation: press 1.4s ease-in-out infinite; }
@keyframes press { 50% { transform: translate(-4px, 6px); } }
.anim-drip { animation: drip 1.6s ease-in infinite; }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
.anim-pulse { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; } }
.anim-shiver { animation: shiver .5s linear infinite; }
@keyframes shiver { 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
@media (prefers-reduced-motion: reduce) {
  .mascot, .anim-tap, .anim-press, .anim-drip, .anim-pulse, .anim-shiver, .key.pop, .done-key { animation: none !important; }
  .confetti { display: none; }
  .lockg.unlocking { animation: none; opacity: 0; }
}
</style>

<script>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let UID = 0;
const TEAM_COLOURS = ['#14A99D', '#FF6F61', '#8A78E3', '#3B7DDD'];

// colours used inside drawings (fixed light look)

  chamber: 'M124,252 C118,214 120,180 132,160 L140,118 L156,156 Q200,172 244,156 L260,118 L268,160 C280,180 282,214 276,252 Q200,266 124,252 Z',

function complete(c, w) {

}
function reveal() {
  const c = chal(), w = work(c); if (done(c)) return;
  if (c.type === 'cloze') { S.res[c.id] = { status: 'miss', how: 'revealed', marks: w.fill.map((f, k) => f === c.ans[k]), pts: 0 }; }
  else S.res[c.id] = { status: 'miss', how: 'revealed', pts: 0 };
  render();
}
function skip() { const c = chal(); if (!done(c)) S.res[c.id] = { status: 'miss', how: 'skipped', pts: 0, marks: c.type === 'cloze' ? c.ans.map(() => false) : undefined }; goNext(); }
function goNext() {
  if (S.room === 'final') { S.finalDone = true; S.view = 'end'; return render(); }
  const r = ROOMS[S.room - 1];
  if (S.idx + 1 < r.ch.length) { S.idx++; startTimer(); render(); }
  else { const n = r.n; if (!S.keys[n - 1]) { S.keys[n - 1] = true; S.justKey = n; if (n < 5 && !S.free) S.justUnlock = n + 1; if (allKeys()) S.justUnlock = 'final'; } S.view = 'roomDone'; render(); }
}
function goPrev() { if (S.room !== 'final' && S.idx > 0) { S.idx--; render(); } }

// ═════════════ timer ═════════════
let tick = null;
function startTimer() { S.timeUp = false; S.timeLeft = S.timer; }
setInterval(() => {
  if (!S.timer || S.paused || !(S.view === 'ch')) return;
  const c = chal(); if (done(c) || S.timeUp) return;
  S.timeLeft = Math.max(0, S.timeLeft - 1);
  const el = document.getElementById('timer');
  if (el) { el.textContent = fmt(S.timeLeft); el.classList.toggle('low', S.timeLeft <= 10); }
  if (S.timeLeft === 0) { S.timeUp = true; render(); }
}, 1000);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

// ═════════════ rendering ═════════════
const root = document.getElementById('root');
function topBar() {
  const teams = Array.from({ length: teamCount() }, (_, i) => `<button class="team ${S.mode === 'solo' ? 'solo' : ''} ${S.active === i && S.mode !== 'solo' ? 'active' : ''}" style="--tc:${TEAM_COLOURS[i]}" data-act="team" data-i="${i}" ${S.mode === 'solo' ? 'tabindex="-1"' : `aria-pressed="${S.active === i}"`}><span class="dot"></span>${teamName(i)}<span class="pts">${S.scores[i]}</span></button>`).join('');
  return `<header class="top">
    <div class="brand">${mascot().replace('class="mascot"', 'class="" style="width:44px;height:auto"')}<div><h1>Endo <span>Quest</span></h1><small>Lecture 9 · Endodontic Terminology</small></div></div>
    ${S.view !== 'setup' ? `<div class="keys" aria-label="Keys collected">${S.keys.map((k, i) => keyIcon(k, S.justKey === i + 1 && S.view === 'map')).join('')}<span class="lab">${S.keys.filter(Boolean).length} / 5 keys</span></div>
    <div class="teams">${S.mode !== 'solo' ? '<span class="hint">Answering:</span>' : ''}${teams}</div>
    <div style="display:flex;gap:8px">${S.view !== 'map' ? '<button class="btn btn-sm" data-act="map">Clinic map</button>' : ''}<button class="btn btn-sm" data-act="askreset">Reset</button></div>` : ''}
  </header>`;
}
function render() {
  let h = topBar();
  if (S.view === 'setup') h += setupView();
  else if (S.view === 'map') h += mapView();
  else if (S.view === 'roomIntro') h += roomIntroView();
  else if (S.view === 'ch') h += chView();
  else if (S.view === 'roomDone') h += roomDoneView();
  else if (S.view === 'end') h += endView();
  if (S.paused) h += `<div class="overlay"><div class="modal">${mascot()}<h2>Discussion pause</h2><p>Talk it through with your team. The timer is stopped.</p><button class="btn btn-go" data-act="resume">Resume</button></div></div>`;
  if (S.confirm) h += `<div class="overlay"><div class="modal"><h2>Reset the game?</h2><p>All scores, keys and answers will be cleared. Team names stay.</p><div style="display:flex;gap:10px"><button class="btn" data-act="noreset">Cancel</button><button class="btn btn-coral" data-act="reset">Reset game</button></div></div></div>`;
  root.innerHTML = h;
  if (S.view === 'map') { S.justKey = null; S.justUnlock = null; }
}

        <div class="notecard"><b>Teacher controls in every challenge:</b> Submit, Reveal answer, Previous, Next, Skip, Pause for discussion, and an Arabic explanation button. In team mode, click a team’s name at the top to choose who is answering before you submit.</div>

      <circle cx="34" cy="34" r="20" fill="${r.col}"/><text x="34" y="41" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="22" fill="#fff">${r.n}</text>
      <text x="62" y="41" font-family="Fredoka, sans-serif" font-weight="600" font-size="${r.name.en.length > 22 ? 16.5 : 20}" fill="${r.ink}">${r.name.en}</text>

    <g transform="translate(40,184)">${S.keys.map((k, i) => `<g transform="translate(${i * 44},0)">${keyIcon(k).replace('<svg', '<svg width="36" height="36"')}</g>`).join('')}</g>

      <text x="500" y="290" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="14" fill="#B79B70" letter-spacing="4">CORRIDOR</text>

function roomIntroView() {
  const r = ROOMS[S.room - 1];
  return `<section class="panel" style="--rc:${r.col};--rc-soft:${r.soft};--rc-ink:${r.ink};align-items:center;text-align:center;padding:30px">
    ${mascot('cheer')}<div class="roomtag" style="justify-content:center"><span class="pill">Room ${r.n}</span></div>
    <h2 style="font-family:var(--f-display);font-size:42px;margin:0">${r.name.en}</h2>
    <p style="font-size:20px;margin:0;max-width:50ch">${r.intro.en}</p>
    ${S.ar ? `<p class="ar" style="font-size:20px;margin:0;text-align:center">${r.name.ar}: ${r.intro.ar}</p>` : ''}
    <div style="display:flex;gap:10px"><button class="btn btn-ar ${S.ar ? 'on' : ''}" data-act="ar">عربي</button><button class="btn btn-go" data-act="begin" style="font-size:20px">Start challenge 1 →</button></div></section>`;
}

function chView() {
  const c = chal(), w = work(c), res = resOf(c);
  const isFinal = S.room === 'final';
  const r = isFinal ? { n: 'final', name: L('Final Challenge', 'التحدي النهائي'), col: '#E5A400', soft: '#FFF1C9', ink: '#8A6200', ch: [FINAL] } : ROOMS[S.room - 1];
  const prog = isFinal ? '' : `<div class="progress">${r.ch.map((cc, k) => `<i class="${resOf(cc) ? (resOf(cc).status === 'ok' ? 'ok' : 'miss') : k === S.idx ? 'cur' : ''}"></i>`).join('')}</div>`;
  const left = visual(c, w, res), right = taskPanel(c, w, res);
  return `<div style="--rc:${r.col};--rc-soft:${r.soft};--rc-ink:${r.ink};display:flex;flex-direction:column;gap:14px">
    <div class="roomtag"><span class="pill">${isFinal ? 'Final challenge' : `Room ${r.n} · ${r.name.en}`}</span>${prog}<span class="count">${isFinal ? '5 blanks · 10 points each' : `Challenge ${S.idx + 1} of ${r.ch.length}`}</span></div>
    <div class="stage">${left}${right}</div></div>`;
}

function markerCtx(c, w, res) {
  return () => c.slots.filter(sl => sl.m).map(sl => {
    const v = w.a[sl.s];
    let cls = v ? 'filled' : '', tag = '';
    if (res) { const ok = res.how === 'answered' && v === sl.ans; cls = res.how === 'answered' ? (ok ? 'ok' : 'bad') : 'ok'; tag = sl.big ? '' : sl.ans; }
    else if (w.sel) cls += ' armed';
    return marker(sl.s, ...sl.m, { cls, tag });
  }).join('');
}
function visual(c, w, res) {
  if (c.type === 'cloze') {
    let note = `<span class="head">Clinical note</span>`;
    c.parts.forEach((p, k) => {
      note += p;
      if (k < c.ans.length) {
        const f = w.fill[k]; let cls = !res && w.sel === k ? 'sel' : '';
        if (res) cls = res.marks[k] ? 'ok' : 'bad';
        note += `<button class="blank ${cls}" data-act="blank" data-k="${k}" ${res ? 'disabled' : ''}><span class="n">${k + 1}</span>${res && !res.marks[k] ? `${f ? `<s>${f}</s> ` : ''}${c.ans[k]}` : f || '&nbsp;'}</button>`;
      }
    });
    return `<section class="panel"><div class="note-sheet">${note}</div><div style="display:flex;gap:12px;align-items:center">${mascot(res ? 'cheer' : 'happy').replace('class="mascot"', 'class="mascot" style="width:90px"')}<p class="sub">Tap a blank, then tap a word from the bank. Tap a filled blank to clear it.</p></div></section>`;
  }
  if (c.type === 'mc' && c.patient) return `<section class="panel"><div class="vis"><div class="duo" style="grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)">${patient(c.patient)}<div class="bubble" style="font-size:22px;font-weight:700;font-family:var(--f-display)">${c.say}</div></div></div></section>`;
  if (c.type === 'mc' && c.scene) return `<section class="panel"><div class="vis">${SCENES[c.scene]()}</div><p class="sub" style="text-align:center">A cold pellet is placed on the tooth.</p></section>`;
  if (c.type === 'mc' && c.vis) return `<section class="panel"><div class="vis">${c.vis()}</div></section>`;
  if (c.type === 'order') return `<section class="panel"><div class="vis">${traySVG()}</div><div class="notecard"><b>Simplified overview.</b> ${c.note}</div></section>`;
  if (c.type === 'click') {
    const hc = id => res ? (id === c.ans ? 'ok' : w.hot === id ? 'bad' : '') : w.hot === id ? 'sel' : '';
    return `<section class="panel"><div class="vis">${c.vis({ hc })}</div>${res ? `<p class="sub" style="text-align:center"><b style="color:var(--ok)">Green</b> = ${c.ansLabel || 'accessory canal'}${w.hot && w.hot !== c.ans ? ` · you chose: ${c.names[w.hot]}` : ''}</p>` : ''}</section>`;
  }
  if (c.type === 'match' && c.layout === 'cards') {
    const cards = c.slots.map(sl => {
      const v = w.a[sl.s]; let dcls = v ? 'filled' : '';
      if (res) dcls = res.how === 'answered' ? (v === sl.ans ? 'ok' : 'bad') : 'ok';
      return `<div class="card ${!res && w.sel && !v ? 'armed' : ''}" data-act="slot" data-slot="${sl.s}" role="button" tabindex="0" aria-label="Card ${sl.s}"><span class="letter">${sl.s}</span>${sl.pic ? sl.pic() : ''}
        ${sl.name ? `<span class="cname">${sl.name}</span>` : ''}${sl.text ? `<span class="ctext ${sl.pic ? '' : 'big'}">${sl.text}</span>` : ''}
        <span class="drop ${dcls}">${res ? (res.how === 'answered' && v !== sl.ans ? `<span><s>${v}</s><br>${sl.ans}</span>` : sl.ans) : v || 'Tap a term, then tap here'}</span></div>`;
    }).join('');
    return `<section class="panel"><div class="cards">${cards}</div></section>`;
  }
  if (c.type === 'match') return `<section class="panel"><div class="vis">${c.vis({ markers: markerCtx(c, w, res) })}</div></section>`;
  return '';
}

function taskPanel(c, w, res) {
  let body = '';
  const terms = S.shuf[c.id];
  if (c.type === 'match') {
    const used = Object.values(w.a);
    body += `<div class="howto">${res ? 'Answer' : 'Terms'}</div><div class="chips">${terms.map(t => {
      let cls = w.sel === t ? 'sel' : used.includes(t) ? 'used' : '';
      if (res) cls = c.slots.some(sl => sl.ans === t) ? 'ok' : '';
      return `<button class="chip ${cls}" data-act="term" data-t="${encodeURIComponent(t)}" ${res ? 'disabled' : ''}>${t}</button>`; }).join('')}</div>`;
    if (c.layout !== 'cards') body += `<div class="slots">${c.slots.map(sl => {
      const v = w.a[sl.s]; let cls = v ? 'filled' : '';
      if (res) cls = res.how === 'answered' ? (v === sl.ans ? 'ok' : 'bad') : 'ok';
      return `<button class="slot ${cls}" data-act="slot" data-slot="${sl.s}" ${res ? 'disabled' : ''}><span class="l">${sl.s}</span>${res ? (res.how === 'answered' && v !== sl.ans ? `<span><s>${v || '—'}</s> → <b>${sl.ans}</b></span>` : `<b>${sl.ans}</b>`) : v ? `<b>${v}</b>` : '<span class="ph">Tap a term, then tap here</span>'}</button>`; }).join('')}</div>`;
  }
  if (c.type === 'mc') {
    body += c.badge ? `<span class="badge2">${c.badge}</span>` : '';
    body += `<div class="opts">${terms.map(t => {
      let cls = w.sel.includes(t) ? 'sel' : '';
      if (res) cls = c.ans.includes(t) ? 'ok' : w.sel.includes(t) ? 'bad' : '';
      return `<button class="opt ${c.multi ? '' : 'radio'} ${cls}" data-act="opt" data-t="${encodeURIComponent(t)}" ${res ? 'disabled' : ''} aria-pressed="${w.sel.includes(t)}"><span class="box"></span>${t}</button>`; }).join('')}</div>`;
  }
  if (c.type === 'order') {
    body += `<div class="howto">Your order (tap a step to remove it)</div><div class="seq">${c.items.map((_, k) => {
      const v = w.seq[k]; let cls = v ? 'filled' : '';
      if (res) cls = res.how === 'answered' ? (v === c.items[k] ? 'ok' : 'bad') : 'ok';
      return `<button class="step ${cls}" data-act="unseq" data-k="${k}" ${res || !v ? 'disabled' : ''}>${res ? (res.how === 'answered' && v !== c.items[k] ? `<span><s>${v}</s> → <b>${c.items[k]}</b></span>` : c.items[k]) : v || '<span class="ph" style="color:var(--muted)">…</span>'}</button>`; }).join('')}</div>`;
    if (!res) body += `<div class="howto">Steps (tap in order)</div><div class="chips">${terms.map(t => `<button class="chip ${w.seq.includes(t) ? 'used' : ''}" data-act="seq" data-t="${encodeURIComponent(t)}" ${w.seq.includes(t) ? 'disabled' : ''}>${t}</button>`).join('')}</div>`;
  }
  if (c.type === 'click' && !res) body += `<p class="sub">${w.hot ? `Selected: <b>a part of the tooth</b>. Submit when ready, or click another part.` : 'Nothing selected yet.'}</p>`;
  if (c.type === 'cloze') {
    body += `<div class="howto">Word bank</div><div class="chips">${terms.map(t => `<button class="chip ${w.fill.includes(t) ? 'used' : ''}" data-act="word" data-t="${encodeURIComponent(t)}" ${res || w.fill.includes(t) ? 'disabled' : ''}>${t}</button>`).join('')}</div>`;
  }
  // feedback
  let fb = '';
  if (res) {
    const isCloze = c.type === 'cloze';
    const nOk = isCloze ? res.marks.filter(Boolean).length : 0;
    const kind = res.how === 'revealed' || res.how === 'skipped' ? 'rev' : res.status === 'ok' ? 'ok' : 'bad';
    const verdict = res.how === 'revealed' ? 'Answer revealed' : res.how === 'skipped' ? 'Skipped' : isCloze ? `${nOk} of 5 blanks correct · +${res.pts} points` : res.status === 'ok' ? `Correct! +10 for ${teamName(res.team)}` : 'Not quite';
    fb = `<div class="fb ${kind}"><b class="v">${verdict}</b><span class="ans">Correct answer: ${answerText(c)}</span><span>${c.ex.en}</span>
      ${c.warn ? `<span class="warn"><b>Remember:</b> ${c.warn}</span>` : ''}
      ${S.ar ? `<div class="arx ar" lang="ar">${c.ex.ar}</div>` : ''}</div>`;
  }
  const isFinal = S.room === 'final';
  const timer = S.timer ? `<span class="timer ${S.timeLeft <= 10 ? 'low' : ''}" id="timer" aria-label="Time left">${fmt(S.timeLeft)}</span>` : '';
  const lastInRoom = !isFinal && S.idx === ROOMS[S.room - 1].ch.length - 1;
  const ctrls = `<div class="controls">
      <div class="grp"><button class="btn btn-sm" data-act="prev" ${isFinal || S.idx === 0 ? 'disabled' : ''}>◀ Previous</button><button class="btn btn-sm" data-act="skip" ${res ? 'disabled' : ''}>Skip</button><button class="btn btn-sm" data-act="pause">Pause</button><button class="btn btn-sm btn-ar ${S.ar ? 'on' : ''}" data-act="ar" aria-pressed="${S.ar}">عربي</button>${timer}</div>
      <div class="grp"><button class="btn" data-act="reveal" ${res ? 'disabled' : ''}>Reveal answer</button>
      ${res ? `<button class="btn btn-go" data-act="next">${isFinal ? 'Finish →' : lastInRoom ? 'Collect the key →' : 'Next ▶'}</button>` : `<button class="btn btn-go" data-act="submit" ${complete(c, w) ? '' : 'disabled'}>Submit</button>`}</div></div>`;
  return `<section class="panel" aria-live="polite">
    <p class="instr">${c.instr}</p>${c.sub && !res ? `<p class="sub">${c.sub}</p>` : ''}
    ${S.timeUp && !res ? '<div class="fb rev"><b class="v">Time’s up!</b><span>Submit the answer now, or reveal it.</span></div>' : ''}
    ${body}${fb}${ctrls}</section>`;
}

function roomDoneView() {
  const r = ROOMS[S.room - 1];
  const nOk = r.ch.filter(c => resOf(c) && resOf(c).status === 'ok').length;
  return `<section class="panel" style="align-items:center;text-align:center;padding:30px">
    <svg class="done-key" viewBox="0 0 40 40" aria-hidden="true"><circle cx="12" cy="20" r="9" fill="#FFC23D" stroke="#C48A00" stroke-width="1.5"/><path d="M19,17 H36 V23 H33 V28 H28 V23 H19 Z" fill="#FFC23D" stroke="#C48A00" stroke-width="1.5"/><circle cx="12" cy="20" r="3.5" fill="#fff"/></svg>
    <h2 style="font-family:var(--f-display);font-size:40px;margin:0">Key collected!</h2>
    <p style="font-size:20px;margin:0">Room ${r.n} · ${r.name.en}: ${nOk} of ${r.ch.length} challenges correct.</p>
    ${r.outro ? `<div class="notecard" style="max-width:640px;text-align:start"><b>Before you leave this room:</b> ${r.outro.en}${S.ar ? `<div class="ar" style="margin-top:6px">${r.outro.ar}</div>` : ''}</div>` : ''}
    <div style="display:flex;gap:10px">${r.outro ? `<button class="btn btn-ar ${S.ar ? 'on' : ''}" data-act="ar">عربي</button>` : ''}<button class="btn btn-go" data-act="map" style="font-size:20px">Back to the clinic map →</button></div></section>${confetti(40)}`;
}

function endView() {
  const order = Array.from({ length: teamCount() }, (_, i) => i).sort((a, b) => S.scores[b] - S.scores[a]);
  const missed = [...ALL, FINAL].filter(c => resOf(c) && resOf(c).status !== 'ok');
  const unanswered = [...ALL, FINAL].filter(c => !resOf(c));
  const roomName = c => c === FINAL ? 'Final challenge' : `Room ${c.room} · ${ROOMS[c.room - 1].name.en}`;
  const max = ALL.length * 10 + 50;
  return `<section class="panel" style="align-items:center;text-align:center">${mascot('cheer')}<h2 style="font-family:var(--f-display);font-size:42px;margin:0">The clinic is unlocked!</h2>
      <p style="margin:0;font-size:18px">Maximum possible: ${max} points.</p>
      <div class="rank" style="width:min(520px,100%)">${order.map((i, k) => `<div><span>${k === 0 && S.mode !== 'solo' ? 'Winner · ' : ''}${teamName(i)}</span><span>${S.scores[i]}</span></div>`).join('')}</div></section>
    <section class="panel"><h2 style="font-family:var(--f-display);margin:0">What the class found difficult</h2>
      ${missed.length ? `<p class="sub">Missed, revealed or skipped. Review these terms together.</p><div class="review">${missed.map(c => {
        const r = resOf(c); const extra = c === FINAL ? ` (blanks missed: ${r.marks.map((m, k) => m ? null : k + 1).filter(Boolean).join(', ')})` : '';
        return `<div class="item"><span class="room">${roomName(c)} · ${r.how === 'revealed' ? 'revealed' : r.how === 'skipped' ? 'skipped' : 'answered incorrectly'}${extra}</span><b>${c.instr}</b><span><b>Answer:</b> ${answerText(c)}</span><span>${c.ex.en}</span>${S.ar ? `<span class="ar">${c.ex.ar}</span>` : ''}</div>`; }).join('')}</div>`
        : '<p>Nothing missed. Every challenge was answered correctly!</p>'}
      ${unanswered.length ? `<p class="sub">${unanswered.length} challenge(s) were not opened.</p>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ar ${S.ar ? 'on' : ''}" data-act="ar">عربي</button><button class="btn" data-act="map">Clinic map</button><button class="btn btn-go" data-act="again">Play again</button></div></section>${confetti(80)}`;
}
function confetti(n) {
  const cols = ['#14A99D', '#3B7DDD', '#FF6F61', '#8A78E3', '#FFC23D'];
  return `<div class="confetti" aria-hidden="true">${Array.from({ length: n }, () => `<i style="left:${Math.random() * 100}%;background:${cols[Math.floor(Math.random() * 5)]};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s"></i>`).join('')}</div>`;
}

// ═════════════ events ═════════════
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, c = (S.view === 'ch') ? chal() : null, w = c ? work(c) : null;
  switch (a) {
    case 'mode': S.mode = el.dataset.v; render(); break;
    case 'nteams': S.nTeams = +el.dataset.v; render(); break;
    case 'timer': S.timer = +el.dataset.v; render(); break;
    case 'free': S.free = el.checked; break;
    case 'tname': return;
    case 'start': S.view = 'map'; S.active = 0; render(); break;
    case 'team': if (S.mode !== 'solo') { S.active = +el.dataset.i; render(); } break;
    case 'map': S.view = 'map'; render(); break;
    case 'results': S.view = 'end'; render(); break;
    case 'room': {
      const n = el.dataset.n;
      if (n === 'final') { if (!allKeys()) return; S.room = 'final'; S.idx = 0; S.view = 'ch'; work(FINAL); startTimer(); render(); return; }
      if (!roomUnlocked(+n)) return;
      S.room = +n; const r = ROOMS[S.room - 1]; const firstOpen = r.ch.findIndex(cc => !done(cc));
      S.idx = firstOpen < 0 ? 0 : firstOpen; S.view = firstOpen === 0 ? 'roomIntro' : 'ch'; startTimer(); render(); break;
    }
    case 'begin': S.view = 'ch'; startTimer(); render(); break;
    case 'ar': S.ar = !S.ar; render(); break;
    case 'pause': S.paused = true; render(); break;
    case 'resume': S.paused = false; render(); break;
    case 'askreset': S.confirm = true; render(); break;
    case 'noreset': S.confirm = false; render(); break;
    case 'reset': case 'again': S = newState(S); render(); break;
    case 'submit': submit(); break;
    case 'reveal': reveal(); break;
    case 'skip': skip(); break;
    case 'next': goNext(); break;
    case 'prev': goPrev(); break;
    case 'term': { if (resOf(c)) return; const t = decodeURIComponent(el.dataset.t); w.sel = w.sel === t ? null : t; render(); break; }
    case 'slot': {
      if (!c || resOf(c)) return; const s = el.dataset.slot;
      if (w.sel) { for (const k in w.a) if (w.a[k] === w.sel) delete w.a[k]; w.a[s] = w.sel; w.sel = null; }
      else if (w.a[s]) delete w.a[s];
      render(); break;
    }
    case 'opt': { if (resOf(c)) return; const t = decodeURIComponent(el.dataset.t);
      if (c.multi) { w.sel = w.sel.includes(t) ? w.sel.filter(x => x !== t) : (w.sel.length < c.ans.length ? [...w.sel, t] : w.sel); } else w.sel = [t];
      render(); break; }
    case 'seq': { if (resOf(c)) return; const t = decodeURIComponent(el.dataset.t); if (!w.seq.includes(t)) w.seq.push(t); render(); break; }
    case 'unseq': { if (resOf(c)) return; w.seq.splice(+el.dataset.k, 1); render(); break; }
    case 'hot': { if (resOf(c)) return; w.hot = el.dataset.hot; render(); break; }
    case 'blank': { if (resOf(c)) return; const k = +el.dataset.k; if (w.fill[k]) { w.fill[k] = null; } w.sel = k; render(); break; }
    case 'word': { if (resOf(c)) return; const t = decodeURIComponent(el.dataset.t);
      let k = w.sel != null && !w.fill[w.sel] ? w.sel : w.fill.findIndex(f => !f); if (k < 0) return;
      w.fill[k] = t; const nx = w.fill.findIndex(f => !f); w.sel = nx < 0 ? null : nx; render(); break; }
  }
});
document.addEventListener('input', e => { if (e.target.dataset.act === 'tname') S.teamNames[+e.target.dataset.i] = e.target.value || DEFAULT_TEAMS[+e.target.dataset.i]; });
document.addEventListener('change', e => { if (e.target.dataset.act === 'free') S.free = e.target.checked; });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act], div[data-act][role="button"]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
render();
</script>

</body></html>
